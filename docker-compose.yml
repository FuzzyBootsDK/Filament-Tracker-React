services:
  filament-tracker:
    build: .
    container_name: filament-tracker
    restart: unless-stopped
    ports:
      - "8001:3001"    # Web UI + API  (host 8001 -> container 3001)
      - "1883:1883"    # MQTT relay (optional, enabled in Settings)
    volumes:
      - ./data:/app/data
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATA_DIR: /app/data
      # No login required — every request runs as a built-in local admin.
      # Set to "false" (and set JWT_SECRET in .env) to require login again.
      AUTH_DISABLED: "${AUTH_DISABLED:-true}"
      JWT_SECRET: "${JWT_SECRET:-}"
      CORS_ORIGIN: "http://localhost:8001"
    # Bridge networking (host networking is not supported on Docker Desktop for
    # Windows). Outbound connections to Bambu printers on the LAN work fine;
    # only multicast/broadcast auto-discovery is unavailable — add printers by IP.
    extra_hosts:
      - "host.docker.internal:host-gateway"
