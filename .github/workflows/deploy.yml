#  Build the image here; ask the homelab to deploy it.
#
#  This repository is public, which is why it has no self-hosted runner. A runner executes jobs on a
#  machine inside the home network, and on a public repository the job definition can arrive from a
#  stranger's fork. So this builds, publishes to GHCR, and sends a request to Homelab-Migration,
#  which owns the runners and checks what it is asked to do against a closed allowlist.
#
#  Rollback: Homelab-Migration -> Actions -> Deploy -> Run workflow, app `filament` and a tag.
name: Build and publish

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

permissions:
  contents: read
  packages: write

concurrency:
  group: build-filament
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/fuzzybootsdk/filament-tracker

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Ask the homelab to deploy it
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/FuzzyBootsDK/Homelab-Migration/dispatches \
            -d '{"event_type":"deploy","client_payload":{"app":"filament","tag":"${{ steps.meta.outputs.tag }}"}}'
          echo "dispatched: filament ${{ steps.meta.outputs.tag }}"
